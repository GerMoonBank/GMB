<!doctype html>
<html lang="fr" data-theme="clair">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Commander une carte — Espace client GerMoonBank</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F3F5FA">
  <link rel="icon" href="../../assets/logo/favicon.ico" sizes="48x48">
  <link rel="icon" href="../../assets/logo/gmb-icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../assets/logo/apple-touch-icon.png">
  <link rel="manifest" href="../../manifest.json">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/utilities.css">
  <link rel="stylesheet" href="../../css/pages/onboarding.css">
  <link rel="stylesheet" href="../../css/pages/auth.css">
  <link rel="stylesheet" href="../../css/app.css">
  <script type="module" src="../../js/app/accounts.js"></script>
</head>
<body data-app="commande-carte" class="app-corps">
  <a class="gmb-lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="app-entete">
    <a class="app-entete__marque" href="../../app/index.html"><strong>GerMoonBank</strong></a>
    <div class="app-entete__actions"><span class="app-entete__identite" data-app-identite></span>
      <button type="button" class="gmb-bouton gmb-bouton--fantome gmb-bouton--petit app-entete__bouton" data-discret aria-pressed="false"><svg class="app-entete__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="app-entete__libelle">Masquer les montants</span></button>
      <button type="button" class="gmb-bouton gmb-bouton--secondaire gmb-bouton--petit app-entete__bouton" data-deconnexion><svg class="app-entete__icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg><span class="app-entete__libelle">Se déconnecter</span></button></div>
  </header>
  <div class="app-cadre">
    <nav class="app-nav" aria-label="Espace client" data-app-nav></nav>
    <main id="contenu" class="app-principal" tabindex="-1">
      <div class="gmb-message-formulaire" data-message hidden></div>
      <h1 class="gmb-section__titre" id="titre-page">Nouvelle carte</h1>
      <div class="app-commande" data-commande>
        <form class="app-commande" data-form="commande" novalidate>
          <fieldset class="app-segments"><legend>Type de carte</legend>
            <label><input type="radio" name="type" value="physique" checked>Carte physique</label>
            <label><input type="radio" name="type" value="virtuelle">Carte virtuelle</label></fieldset>
          <div class="app-commande__apercu"><div data-apercu></div><p class="app-commande__inclus" data-inclus></p></div>
          <p class="gmb-champ__erreur" data-epuise hidden></p>
          <div class="gmb-champ" data-champ-compte><label class="gmb-champ__libelle" for="compte">Compte débité</label><div class="gmb-liste"><select class="gmb-saisie" id="compte" name="compte"></select></div></div>
          <fieldset class="gmb-carte gmb-pile gmb-pile--moyenne" data-livraison><legend class="gmb-section__titre gmb-section__titre--moyen">Adresse de livraison</legend>
            <div class="gmb-champ"><label class="gmb-champ__libelle" for="ligne1">Numéro et rue</label><input class="gmb-saisie" id="ligne1" name="ligne1" type="text" autocomplete="address-line1"></div>
            <div class="gmb-champ"><label class="gmb-champ__libelle" for="ligne2">Complément d’adresse (facultatif)</label><input class="gmb-saisie" id="ligne2" name="ligne2" type="text" autocomplete="address-line2"></div>
            <div class="app-champs-2"><div class="gmb-champ"><label class="gmb-champ__libelle" for="code_postal">Code postal</label><input class="gmb-saisie" id="code_postal" name="code_postal" type="text" autocomplete="postal-code"></div>
              <div class="gmb-champ"><label class="gmb-champ__libelle" for="ville">Ville</label><input class="gmb-saisie" id="ville" name="ville" type="text" autocomplete="address-level2"></div></div>
            <div class="gmb-champ"><label class="gmb-champ__libelle" for="pays">Pays</label><div class="gmb-liste"><select class="gmb-saisie" id="pays" name="pays" autocomplete="country"></select></div></div></fieldset>
          <div class="gmb-rangee"><button type="submit" class="gmb-bouton gmb-bouton--principal">Commander la carte</button><a class="gmb-bouton gmb-bouton--fantome" href="index.html">Annuler</a></div>
        </form>
      </div>
    </main>
  </div>
</body>
</html>
