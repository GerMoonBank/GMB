<!doctype html>
<html lang="fr" data-theme="clair">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Journal d’audit — Back-office GerMoonBank</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F3F5FA">
  <link rel="icon" href="../assets/logo/favicon.ico" sizes="48x48">
  <link rel="icon" href="../assets/logo/gmb-icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/pages/onboarding.css">
  <link rel="stylesheet" href="../css/pages/bo.css">
  <script type="module" src="../js/components.js"></script>
  <script type="module" src="../js/bo/bo.js"></script>
</head>
<body data-bo="audit">
  <a class="gmb-lien-evitement" href="#contenu">Aller au contenu</a>
  <header class="bo-entete">
    <a class="bo-entete__marque" href="index.html"><strong>GerMoonBank</strong> <span>Back-office</span></a>
    <div class="bo-entete__utilisateur"><span data-bo-nom></span> <button type="button" class="gmb-bouton gmb-bouton--secondaire gmb-bouton--petit" data-bo-deconnexion>Se déconnecter</button></div>
  </header>
  <div class="bo-corps">
    <nav class="bo-nav" aria-label="Modules du back-office" data-bo-nav></nav>
    <main id="contenu" class="bo-principal" tabindex="-1">
      <div class="gmb-message-formulaire" data-message hidden></div>
      <div class="gmb-pile gmb-pile--large" data-bo-contenu>
        <h1 class="gmb-section__titre" id="titre-page">Journal d’audit</h1>
        <p>Chaque entrée est chaînée à la précédente par une empreinte : une modification a posteriori serait détectée.</p>
        <form class="gmb-carte bo-filtres" data-form="filtre" novalidate role="search"><div class="gmb-champ"><label class="gmb-champ__libelle" for="texte">Filtrer (action, objet, motif, acteur)</label><input class="gmb-saisie" id="texte" name="texte" type="search"></div></form>
        <div data-liste><p>Chargement…</p></div>
      </div>
    </main>
  </div>
</body>
</html>
